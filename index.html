<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Operations Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .kpi-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 150px;
        }

        .kpi-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .kpi-label {
            font-size: 0.95em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .kpi-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .chart-card {
            grid-column: span 2;
        }

        @media (max-width: 1200px) {
            .chart-card {
                grid-column: span 1;
            }
        }

        .chart-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .chart-container {
            position: relative;
            height: 350px;
            margin-bottom: 20px;
        }

        .table-card {
            grid-column: span 2;
            overflow-x: auto;
        }

        .table-card table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        .table-card th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        .table-card td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #555;
        }

        .table-card tr:hover {
            background-color: #f8f9ff;
        }

        .table-card tr:last-child td {
            border-bottom: none;
        }

        .rank {
            font-weight: bold;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 30px;
            text-align: center;
            display: inline-block;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            font-size: 1.2em;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .filter-group select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            grid-column: span 1;
            align-items: flex-end;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c00;
        }

        .success {
            background: #efe;
            color: #0c0;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #0c0;
        }

        .metric-small {
            font-size: 0.85em;
            color: #999;
            margin-top: 8px;
        }

        .grid-2 {
            grid-column: span 1;
        }

        @media (max-width: 768px) {
            .chart-card,
            .table-card {
                grid-column: span 1;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .dashboard {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Sales & Operations Dashboard</h1>
            <p>Real-time insights from your sales pipeline</p>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="teamFilter">Team Name</label>
                <select id="teamFilter">
                    <option value="">All Teams</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="enterpriseFilter">Enterprise</label>
                <select id="enterpriseFilter">
                    <option value="">All Enterprises</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="monthFilter">Month</label>
                <select id="monthFilter">
                    <option value="">All Months</option>
                </select>
            </div>
            <div class="btn-group">
                <button onclick="applyFilters()">Apply Filters</button>
                <button onclick="resetFilters()" style="background: #999;">Reset</button>
            </div>
        </div>

        <div id="messageBox"></div>

        <div id="dashboardContent">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading dashboard data...</span>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];

        const CARD_UUID = '1d6e0c0d-ad06-4cfe-8308-ddff05187eca';
        const METABASE_BASE_URL = 'https://metabase.spyne.ai';

        // Fetch data from Metabase Public API
        async function fetchData() {
            try {
                console.log('Fetching data from Metabase...');
                
                // Use the public API endpoint
                const METABASE_URL = `${METABASE_BASE_URL}/api/public/card/${CARD_UUID}/query`;
                
                const response = await fetch(METABASE_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    mode: 'cors'
                });

                console.log('Response status:', response.status);

                if (!response.ok) {
                    // Try alternative endpoint if first fails
                    console.log('Trying alternative endpoint...');
                    return fetchDataAlternative();
                }

                const result = await response.json();
                console.log('Data received:', result);
                
                allData = result.data?.rows || result.rows || [];
                
                if (allData.length === 0) {
                    throw new Error('No data rows found in response');
                }

                filteredData = allData;
                populateFilters();
                renderDashboard();
                showMessage('✅ Data loaded successfully!', 'success');
            } catch (error) {
                console.error('Error fetching data:', error);
                return fetchDataAlternative();
            }
        }

        // Alternative fetch method using direct query endpoint
        async function fetchDataAlternative() {
            try {
                console.log('Using alternative API endpoint...');
                const METABASE_URL = `${METABASE_BASE_URL}/api/public/card/${CARD_UUID}`;
                
                const response = await fetch(METABASE_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    mode: 'cors'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const cardData = await response.json();
                console.log('Card data:', cardData);
                
                // If we got card data, try to fetch with actual query
                if (cardData.id) {
                    return fetchWithQueryParams(cardData);
                }
                
                allData = cardData.data?.rows || cardData.rows || [];
                
                if (allData.length === 0) {
                    throw new Error('No data available');
                }

                filteredData = allData;
                populateFilters();
                renderDashboard();
                showMessage('✅ Data loaded successfully!', 'success');
            } catch (error) {
                console.error('Alternative fetch failed:', error);
                showMetabaseEmbed();
            }
        }

        // Fetch with query parameters
        async function fetchWithQueryParams(cardData) {
            try {
                console.log('Fetching with query params...');
                const queryUrl = `${METABASE_BASE_URL}/api/public/card/${CARD_UUID}/query?parameters=[]`;
                
                const response = await fetch(queryUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    mode: 'cors',
                    body: JSON.stringify({ parameters: [] })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                console.log('Query result:', result);
                
                allData = result.data?.rows || result.rows || [];
                
                if (allData.length === 0) {
                    throw new Error('No data in query response');
                }

                filteredData = allData;
                populateFilters();
                renderDashboard();
                showMessage('✅ Data loaded successfully!', 'success');
            } catch (error) {
                console.error('Query params fetch failed:', error);
                showMetabaseEmbed();
            }
        }

        // Fallback: Embed Metabase directly
        function showMetabaseEmbed() {
            console.log('Falling back to Metabase embed...');
            document.getElementById('dashboardContent').innerHTML = `
                <div class="card" style="padding: 0; border: none;">
                    <div style="position: relative; width: 100%; padding-bottom: 66.66%; height: 0; overflow: hidden;">
                        <iframe 
                            src="${METABASE_BASE_URL}/public/question/${CARD_UUID}"
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 12px;"
                            allowfullscreen
                            webkitallowfullscreen
                            mozallowfullscreen>
                        </iframe>
                    </div>
                </div>
                <div class="success" style="margin-top: 20px;">
                    <strong>ℹ️ Note:</strong> Metabase data is being loaded directly from your public link. 
                    The embedded view shows real-time data from your query.
                </div>
            `;
        }

        // Populate filter dropdowns
        function populateFilters() {
            const teams = [...new Set(allData.map(r => r[1]).filter(Boolean))].sort();
            const enterprises = [...new Set(allData.map(r => r[3]).filter(Boolean))].sort();
            const months = [...new Set(allData.map(r => r[10]).filter(Boolean))].sort();

            const teamSelect = document.getElementById('teamFilter');
            teams.forEach(team => {
                const option = document.createElement('option');
                option.value = team;
                option.textContent = team;
                teamSelect.appendChild(option);
            });

            const enterpriseSelect = document.getElementById('enterpriseFilter');
            enterprises.forEach(ent => {
                const option = document.createElement('option');
                option.value = ent;
                option.textContent = ent;
                enterpriseSelect.appendChild(option);
            });

            const monthSelect = document.getElementById('monthFilter');
            months.forEach(month => {
                const option = document.createElement('option');
                option.value = month;
                option.textContent = month;
                monthSelect.appendChild(option);
            });
        }

        // Apply filters
        function applyFilters() {
            const team = document.getElementById('teamFilter').value;
            const enterprise = document.getElementById('enterpriseFilter').value;
            const month = document.getElementById('monthFilter').value;

            filteredData = allData.filter(row => {
                return (!team || row[1] === team) &&
                       (!enterprise || row[3] === enterprise) &&
                       (!month || row[10] === month);
            });

            renderDashboard();
        }

        function resetFilters() {
            document.getElementById('teamFilter').value = '';
            document.getElementById('enterpriseFilter').value = '';
            document.getElementById('monthFilter').value = '';
            filteredData = allData;
            renderDashboard();
        }

        // Show messages
        function showMessage(message, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => {
                messageBox.innerHTML = '';
            }, 5000);
        }

        // Calculate KPIs
        function calculateKPIs() {
            const distinctTeams = new Set(filteredData.map(r => r[1]).filter(Boolean)).size;
            const distinctEnterprises = new Set(filteredData.map(r => r[3]).filter(Boolean)).size;
            const totalARR = filteredData.reduce((sum, r) => sum + (parseFloat(r[8]) || 0), 0);
            const totalSkus = filteredData.reduce((sum, r) => sum + (parseFloat(r[11]) || 0), 0);

            return {
                distinctTeams,
                distinctEnterprises,
                totalARR,
                totalSkus
            };
        }

        // Get top enterprises by ARR
        function getTopEnterprises(limit = 10) {
            const enterprises = {};
            
            filteredData.forEach(row => {
                const name = row[3];
                const arr = parseFloat(row[8]) || 0;
                
                if (name) {
                    enterprises[name] = (enterprises[name] || 0) + arr;
                }
            });

            return Object.entries(enterprises)
                .map(([name, arr]) => ({ name, arr }))
                .sort((a, b) => b.arr - a.arr)
                .slice(0, limit);
        }

        // Get month-wise data
        function getMonthWiseData() {
            const monthData = {};
            
            filteredData.forEach(row => {
                const month = row[10];
                const team = row[1];
                const enterprise = row[3];
                const skus = parseFloat(row[11]) || 0;
                const images = parseFloat(row[12]) || 0;

                if (month) {
                    if (!monthData[month]) {
                        monthData[month] = {
                            month,
                            skus: 0,
                            images: 0,
                            teams: new Set(),
                            enterprises: new Set()
                        };
                    }
                    monthData[month].skus += skus;
                    monthData[month].images += images;
                    if (team) monthData[month].teams.add(team);
                    if (enterprise) monthData[month].enterprises.add(enterprise);
                }
            });

            return Object.values(monthData).sort((a, b) => new Date(a.month) - new Date(b.month));
        }

        // Render dashboard
        function renderDashboard() {
            const kpis = calculateKPIs();
            const topEnterprises = getTopEnterprises();
            const monthWiseData = getMonthWiseData();

            let html = `
                <div class="dashboard">
                    <!-- KPI Cards -->
                    <div class="card kpi-card">
                        <div class="kpi-icon">👥</div>
                        <div class="kpi-label">Distinct Teams</div>
                        <div class="kpi-value">${kpis.distinctTeams}</div>
                    </div>

                    <div class="card kpi-card">
                        <div class="kpi-icon">🏢</div>
                        <div class="kpi-label">Distinct Enterprises</div>
                        <div class="kpi-value">${kpis.distinctEnterprises}</div>
                    </div>

                    <div class="card kpi-card">
                        <div class="kpi-icon">💰</div>
                        <div class="kpi-label">Total Contracted ARR</div>
                        <div class="kpi-value">$${(kpis.totalARR / 1000000).toFixed(2)}M</div>
                        <div class="metric-small">${kpis.totalARR.toLocaleString('en-US', {style: 'currency', currency: 'USD'})}</div>
                    </div>

                    <div class="card kpi-card">
                        <div class="kpi-icon">📦</div>
                        <div class="kpi-label">Total SKU Count</div>
                        <div class="kpi-value">${kpis.totalSkus.toLocaleString()}</div>
                    </div>

                    <!-- Top Enterprises by ARR -->
                    <div class="card table-card">
                        <div class="chart-title">Top 10 Enterprises by Contracted ARR</div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Enterprise Name</th>
                                    <th>Contracted ARR</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${topEnterprises.map((ent, idx) => `
                                    <tr>
                                        <td><span class="rank">${idx + 1}</span></td>
                                        <td>${ent.name}</td>
                                        <td><strong>$${ent.arr.toLocaleString('en-US', {maximumFractionDigits: 2})}</strong></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    <!-- Month-wise SKU Count Chart -->
                    <div class="card chart-card">
                        <div class="chart-title">📈 Monthly SKU Count Trend</div>
                        <div class="chart-container">
                            <canvas id="skuChart"></canvas>
                        </div>
                    </div>

                    <!-- Month-wise Image Count Chart -->
                    <div class="card chart-card">
                        <div class="chart-title">🖼️ Monthly Image Count Trend</div>
                        <div class="chart-container">
                            <canvas id="imageChart"></canvas>
                        </div>
                    </div>

                    <!-- Monthly Summary Table -->
                    <div class="card table-card">
                        <div class="chart-title">Monthly Summary</div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Month</th>
                                    <th>SKU Count</th>
                                    <th>Image Count</th>
                                    <th>Teams</th>
                                    <th>Enterprises</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${monthWiseData.map(mData => `
                                    <tr>
                                        <td><strong>${mData.month}</strong></td>
                                        <td>${mData.skus.toLocaleString()}</td>
                                        <td>${mData.images.toLocaleString()}</td>
                                        <td>${mData.teams.size}</td>
                                        <td>${mData.enterprises.size}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            document.getElementById('dashboardContent').innerHTML = html;

            // Render charts
            renderSkuChart(monthWiseData);
            renderImageChart(monthWiseData);
        }

        // Render SKU Chart
        function renderSkuChart(monthWiseData) {
            const ctx = document.getElementById('skuChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthWiseData.map(m => m.month),
                    datasets: [{
                        label: 'SKU Count',
                        data: monthWiseData.map(m => m.skus),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 6,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                font: { size: 12, weight: 'bold' },
                                padding: 15,
                                usePointStyle: true
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { font: { size: 11 } },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        },
                        x: {
                            ticks: { font: { size: 11 } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // Render Image Chart
        function renderImageChart(monthWiseData) {
            const ctx = document.getElementById('imageChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthWiseData.map(m => m.month),
                    datasets: [{
                        label: 'Image Count',
                        data: monthWiseData.map(m => m.images),
                        borderColor: '#764ba2',
                        backgroundColor: 'rgba(118, 75, 162, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 6,
                        pointBackgroundColor: '#764ba2',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                font: { size: 12, weight: 'bold' },
                                padding: 15,
                                usePointStyle: true
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { font: { size: 11 } },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        },
                        x: {
                            ticks: { font: { size: 11 } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // Initialize dashboard
        fetchData();
    </script>
</body>
</html>
