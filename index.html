<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Operations Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-tertiary: #252d3d;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --text-tertiary: #8a8d91;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-color: #30384f;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f2e 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-content h1 {
            font-size: 2.2em;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header-content p {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .data-load-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: var(--accent-light);
        }

        .input-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0;
        }

        .tab-btn {
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .tab-btn.active {
            color: var(--accent-light);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        textarea, input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: monospace;
            font-size: 0.85em;
            resize: vertical;
            min-height: 80px;
        }

        textarea:focus, input[type="file"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
        }

        .filters {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            padding: 12px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-group select:hover {
            border-color: var(--accent);
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-box {
            margin-bottom: 30px;
        }

        .alert {
            padding: 16px 20px;
            border-radius: 10px;
            border-left: 4px solid;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: #86efac;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
            color: #fca5a5;
        }

        .alert-info {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--accent);
            color: #a5b4fc;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
            transform: translateY(-4px);
        }

        .kpi-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .kpi-icon {
            font-size: 2.2em;
            opacity: 0.8;
        }

        .kpi-label {
            font-size: 0.8em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .kpi-value {
            font-size: 2.2em;
            font-weight: 700;
            color: var(--accent-light);
            margin: 12px 0 8px 0;
        }

        .kpi-subtitle {
            font-size: 0.85em;
            color: var(--text-tertiary);
        }

        .chart-card {
            grid-column: span 1;
        }

        @media (max-width: 1400px) {
            .chart-card:nth-child(n+5) {
                grid-column: span 2;
            }
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-container {
            position: relative;
            height: 320px;
        }

        .table-card {
            grid-column: span 2;
        }

        @media (max-width: 1000px) {
            .table-card {
                grid-column: span 1;
            }
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        thead {
            background: rgba(99, 102, 241, 0.1);
            border-bottom: 2px solid var(--border-color);
        }

        th {
            padding: 14px;
            text-align: left;
            font-weight: 600;
            color: var(--accent-light);
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        tbody tr:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85em;
        }

        .value-positive {
            color: var(--success);
            font-weight: 600;
        }

        .data-status {
            text-align: center;
            padding: 15px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 8px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .data-status strong {
            color: var(--accent-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>📊 Sales Operations Dashboard</h1>
                <p>Real-time insights into team performance and enterprise deals</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="downloadData()">📥 Export CSV</button>
                <button class="btn btn-primary" onclick="openDataModal()">📤 Load Your Data</button>
            </div>
        </div>

        <div id="messageBox" class="message-box"></div>

        <div class="filters">
            <div class="filter-group">
                <label>Team Name</label>
                <select id="teamFilter">
                    <option value="">All Teams</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Enterprise</label>
                <select id="enterpriseFilter">
                    <option value="">All Enterprises</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Month</label>
                <select id="monthFilter">
                    <option value="">All Months</option>
                </select>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()">Apply</button>
                <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
            </div>
        </div>

        <div id="dashboardContent"></div>
    </div>

    <!-- Data Input Modal -->
    <div id="dataModal" class="data-load-modal" style="display: none;">
        <div class="modal-content">
            <h2>📥 Load Your Data</h2>
            
            <div class="input-tabs">
                <button class="tab-btn active" onclick="switchTab('tab-csv')">Paste CSV</button>
                <button class="tab-btn" onclick="switchTab('tab-file')">Upload File</button>
                <button class="tab-btn" onclick="switchTab('tab-url')">Metabase URL</button>
            </div>

            <div id="tab-csv" class="tab-content active">
                <div class="input-group">
                    <label>Paste your CSV data here:</label>
                    <textarea id="csvInput" placeholder="team_name,enterprise_name,contracted_arr,month,sku_count,image_count..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button class="btn btn-primary" onclick="loadCSVData()">✅ Load CSV</button>
                    <button class="btn btn-secondary" onclick="closeDataModal()">✕ Close</button>
                </div>
            </div>

            <div id="tab-file" class="tab-content">
                <div class="input-group">
                    <label>Select CSV file:</label>
                    <input type="file" id="csvFile" accept=".csv" onchange="loadFileData()">
                </div>
                <div class="modal-buttons">
                    <button class="btn btn-secondary" onclick="closeDataModal()">✕ Close</button>
                </div>
            </div>

            <div id="tab-url" class="tab-content">
                <div class="input-group">
                    <label>Metabase Public URL (add .csv at end):</label>
                    <input type="text" id="metabaseUrl" placeholder="https://metabase.spyne.ai/public/question/...">
                </div>
                <div class="modal-buttons">
                    <button class="btn btn-primary" onclick="loadMetabaseURL()">🔄 Fetch</button>
                    <button class="btn btn-secondary" onclick="closeDataModal()">✕ Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];

        // Sample data - displayed immediately
        const sampleCSV = `team_id,team_name,enterprise_id,enterprise_name,products,stage,ob_poc_email,cs_poc_email,contracted_arr,monthly_product_arr,month,sku_count,image_count,cost_per_vin,cost_per_image
1,Sales Team A,101,Enterprise Alpha,Product X,Active,john@example.com,jane@example.com,250000,20000,2024-01,150,1200,10.50,2.25
1,Sales Team A,101,Enterprise Alpha,Product X,Active,john@example.com,jane@example.com,250000,22000,2024-02,165,1350,10.50,2.25
1,Sales Team A,101,Enterprise Alpha,Product X,Active,john@example.com,jane@example.com,250000,24000,2024-03,180,1500,10.50,2.25
1,Sales Team A,102,Enterprise Beta,Product Y,Active,john@example.com,mike@example.com,180000,15000,2024-01,120,950,9.75,2.10
1,Sales Team A,102,Enterprise Beta,Product Y,Active,john@example.com,mike@example.com,180000,16500,2024-02,135,1050,9.75,2.10
2,Sales Team B,103,Enterprise Gamma,Product Z,Prospect,sarah@example.com,alice@example.com,320000,26000,2024-01,200,1600,11.00,2.50
2,Sales Team B,103,Enterprise Gamma,Product Z,Prospect,sarah@example.com,alice@example.com,320000,28000,2024-02,220,1750,11.00,2.50
2,Sales Team B,104,Enterprise Delta,Product X,Active,sarah@example.com,bob@example.com,420000,35000,2024-02,280,2100,10.50,2.25
2,Sales Team B,104,Enterprise Delta,Product X,Active,sarah@example.com,bob@example.com,420000,38000,2024-03,310,2300,10.50,2.25
3,Sales Team C,105,Enterprise Epsilon,Product Y,Active,mike@example.com,carol@example.com,550000,45000,2024-01,350,2800,9.75,2.10
3,Sales Team C,106,Enterprise Zeta,Product Z,Prospect,mike@example.com,david@example.com,290000,24000,2024-02,195,1560,11.00,2.50
3,Sales Team C,107,Enterprise Theta,Product X,Active,mike@example.com,emma@example.com,380000,31000,2024-01,240,1920,10.50,2.25
1,Sales Team A,108,Enterprise Iota,Product Y,Prospect,john@example.com,frank@example.com,210000,17000,2024-02,140,1120,9.75,2.10
2,Sales Team B,109,Enterprise Kappa,Product Z,Active,sarah@example.com,grace@example.com,480000,39000,2024-01,320,2560,11.00,2.50
3,Sales Team C,110,Enterprise Lambda,Product X,Active,mike@example.com,henry@example.com,600000,50000,2024-02,400,3000,10.50,2.25`;

        function openDataModal() {
            document.getElementById('dataModal').style.display = 'flex';
        }

        function closeDataModal() {
            document.getElementById('dataModal').style.display = 'none';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showMessage(message, type = 'success') {
            const box = document.getElementById('messageBox');
            box.innerHTML = `<div class="alert alert-${type}"><span>${message}</span></div>`;
            setTimeout(() => box.innerHTML = '', 5000);
        }

        function loadCSVData() {
            const csv = document.getElementById('csvInput').value;
            if (!csv.trim()) {
                showMessage('Please paste CSV data', 'error');
                return;
            }
            parseAndRender(csv);
            closeDataModal();
        }

        function loadFileData() {
            const file = document.getElementById('csvFile').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                parseAndRender(e.target.result);
                closeDataModal();
            };
            reader.readAsText(file);
        }

        async function loadMetabaseURL() {
            const url = document.getElementById('metabaseUrl').value;
            if (!url) {
                showMessage('Please enter Metabase URL', 'error');
                return;
            }
            try {
                const response = await fetch(url);
                const csv = await response.text();
                parseAndRender(csv);
                closeDataModal();
            } catch (e) {
                showMessage(`Error fetching: ${e.message}`, 'error');
            }
        }

        function parseAndRender(csvText) {
            try {
                Papa.parse(csvText, {
                    skipEmptyLines: true,
                    header: false,
                    complete: function(results) {
                        allData = results.data;
                        if (allData.length < 2) {
                            showMessage('CSV must have headers and at least 1 data row', 'error');
                            return;
                        }
                        filteredData = [...allData.slice(1)];
                        populateFilters();
                        renderDashboard();
                        showMessage(`✅ Loaded ${filteredData.length} records!`, 'success');
                    }
                });
            } catch (e) {
                showMessage(`Error parsing CSV: ${e.message}`, 'error');
            }
        }

        function populateFilters() {
            const teams = [...new Set(filteredData.map(r => r[1]).filter(Boolean))].sort();
            const ents = [...new Set(filteredData.map(r => r[3]).filter(Boolean))].sort();
            const months = [...new Set(filteredData.map(r => r[10]).filter(Boolean))].sort();

            const teamSel = document.getElementById('teamFilter');
            const entSel = document.getElementById('enterpriseFilter');
            const monthSel = document.getElementById('monthFilter');

            teamSel.innerHTML = '<option value="">All Teams</option>';
            entSel.innerHTML = '<option value="">All Enterprises</option>';
            monthSel.innerHTML = '<option value="">All Months</option>';

            teams.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                teamSel.appendChild(opt);
            });

            ents.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e;
                opt.textContent = e;
                entSel.appendChild(opt);
            });

            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                monthSel.appendChild(opt);
            });
        }

        function applyFilters() {
            const team = document.getElementById('teamFilter').value;
            const ent = document.getElementById('enterpriseFilter').value;
            const month = document.getElementById('monthFilter').value;

            filteredData = allData.slice(1).filter(row => {
                return (!team || row[1] === team) &&
                       (!ent || row[3] === ent) &&
                       (!month || row[10] === month);
            });

            renderDashboard();
        }

        function resetFilters() {
            document.getElementById('teamFilter').value = '';
            document.getElementById('enterpriseFilter').value = '';
            document.getElementById('monthFilter').value = '';
            filteredData = [...allData.slice(1)];
            renderDashboard();
        }

        function getKPIs() {
            const teams = new Set(filteredData.map(r => r[1]).filter(Boolean));
            const ents = new Set(filteredData.map(r => r[3]).filter(Boolean));
            const arr = filteredData.reduce((s, r) => s + (parseFloat(r[8]) || 0), 0);
            const skus = filteredData.reduce((s, r) => s + (parseFloat(r[11]) || 0), 0);
            const images = filteredData.reduce((s, r) => s + (parseFloat(r[12]) || 0), 0);

            return { teams: teams.size, ents: ents.size, arr, skus, images };
        }

        function getTopEnterprises(limit = 10) {
            const data = {};
            filteredData.forEach(row => {
                const name = row[3];
                const arr = parseFloat(row[8]) || 0;
                if (name) data[name] = (data[name] || 0) + arr;
            });
            return Object.entries(data)
                .map(([name, arr]) => ({ name, arr }))
                .sort((a, b) => b.arr - a.arr)
                .slice(0, limit);
        }

        function getMonthWiseData() {
            const data = {};
            filteredData.forEach(row => {
                const m = row[10];
                if (m) {
                    if (!data[m]) data[m] = { month: m, skus: 0, images: 0 };
                    data[m].skus += parseFloat(row[11]) || 0;
                    data[m].images += parseFloat(row[12]) || 0;
                }
            });
            return Object.values(data).sort((a, b) => new Date(a.month) - new Date(b.month));
        }

        function renderDashboard() {
            const kpis = getKPIs();
            const topEnts = getTopEnterprises();
            const monthData = getMonthWiseData();

            let html = `
                <div class="data-status">
                    📊 Showing <strong>${filteredData.length}</strong> records | <strong>${kpis.teams}</strong> Teams | <strong>${kpis.ents}</strong> Enterprises
                </div>
                <div class="dashboard">
                    <div class="card kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">Distinct Teams</span>
                            <span class="kpi-icon">👥</span>
                        </div>
                        <div class="kpi-value">${kpis.teams}</div>
                    </div>

                    <div class="card kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">Distinct Enterprises</span>
                            <span class="kpi-icon">🏢</span>
                        </div>
                        <div class="kpi-value">${kpis.ents}</div>
                    </div>

                    <div class="card kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">Total Contracted ARR</span>
                            <span class="kpi-icon">💰</span>
                        </div>
                        <div class="kpi-value">$${(kpis.arr / 1000000).toFixed(2)}M</div>
                        <div class="kpi-subtitle">${kpis.arr.toLocaleString('en-US', {style: 'currency', currency: 'USD'})}</div>
                    </div>

                    <div class="card kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">Total SKU Count</span>
                            <span class="kpi-icon">📦</span>
                        </div>
                        <div class="kpi-value">${kpis.skus.toLocaleString()}</div>
                        <div class="kpi-subtitle">${kpis.images.toLocaleString()} images</div>
                    </div>

                    <div class="card table-card">
                        <div class="card-title">🏆 Top 10 Enterprises by ARR</div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Rank</th>
                                        <th>Enterprise Name</th>
                                        <th>Contracted ARR</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${topEnts.map((e, i) => `
                                        <tr>
                                            <td><div class="rank-badge">${i + 1}</div></td>
                                            <td>${e.name}</td>
                                            <td class="value-positive">$${e.arr.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card chart-card">
                        <div class="card-title">📈 Monthly SKU Count</div>
                        <div class="chart-container">
                            <canvas id="skuChart"></canvas>
                        </div>
                    </div>

                    <div class="card chart-card">
                        <div class="card-title">🖼️ Monthly Image Count</div>
                        <div class="chart-container">
                            <canvas id="imageChart"></canvas>
                        </div>
                    </div>

                    <div class="card table-card">
                        <div class="card-title">📅 Monthly Performance Summary</div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Month</th>
                                        <th>SKU Count</th>
                                        <th>Image Count</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${monthData.map(m => `
                                        <tr>
                                            <td style="font-weight: 600;">${m.month}</td>
                                            <td class="value-positive">${m.skus.toLocaleString()}</td>
                                            <td class="value-positive">${m.images.toLocaleString()}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('dashboardContent').innerHTML = html;

            if (monthData.length > 0) {
                renderSkuChart(monthData);
                renderImageChart(monthData);
            }
        }

        function renderSkuChart(monthData) {
            const ctx = document.getElementById('skuChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthData.map(m => m.month),
                    datasets: [{
                        label: 'SKU Count',
                        data: monthData.map(m => m.skus),
                        borderColor: '#818cf8',
                        backgroundColor: 'rgba(129, 140, 248, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 5,
                        pointBackgroundColor: '#818cf8',
                        pointBorderColor: '#1a1f2e',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#e4e6eb' } }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#8a8d91' },
                            grid: { color: 'rgba(99, 102, 241, 0.1)' }
                        },
                        x: { ticks: { color: '#8a8d91' }, grid: { display: false } }
                    }
                }
            });
        }

        function renderImageChart(monthData) {
            const ctx = document.getElementById('imageChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthData.map(m => m.month),
                    datasets: [{
                        label: 'Image Count',
                        data: monthData.map(m => m.images),
                        borderColor: '#a78bfa',
                        backgroundColor: 'rgba(167, 139, 250, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 5,
                        pointBackgroundColor: '#a78bfa',
                        pointBorderColor: '#1a1f2e',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#e4e6eb' } }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#8a8d91' },
                            grid: { color: 'rgba(99, 102, 241, 0.1)' }
                        },
                        x: { ticks: { color: '#8a8d91' }, grid: { display: false } }
                    }
                }
            });
        }

        function downloadData() {
            if (filteredData.length === 0) {
                showMessage('No data to download', 'error');
                return;
            }

            const csv = [
                ['Team Name', 'Enterprise', 'Contracted ARR', 'Month', 'SKU Count', 'Image Count'],
                ...filteredData.map(r => [r[1], r[3], r[8], r[10], r[11], r[12]])
            ].map(row => row.map(v => `"${v}"`).join(',')).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dashboard_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            showMessage('✅ Data exported!', 'success');
        }

        // Load data from Metabase on page load
        async function loadMetabaseData() {
            const metabaseUrl = 'https://metabase.spyne.ai/public/question/1d6e0c0d-ad06-4cfe-8308-ddff05187eca.csv';
            try {
                const response = await fetch(metabaseUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csv = await response.text();
                parseAndRender(csv);
                showMessage('✅ Data loaded from Metabase!', 'success');
            } catch (error) {
                console.error('Failed to load Metabase data:', error);
                showMessage('⚠️ Using sample data. Click "Load Your Data" to add your Metabase CSV.', 'info');
                parseAndRender(sampleCSV);
            }
        }

        window.addEventListener('load', loadMetabaseData);
    </script>
</body>
</html>
