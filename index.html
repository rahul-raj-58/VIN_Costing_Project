<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Operations Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-tertiary: #252d3d;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --text-tertiary: #8a8d91;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-color: #30384f;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f2e 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-content h1 {
            font-size: 2.2em;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header-content p {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .filters {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            padding: 12px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-group select:hover {
            border-color: var(--accent);
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-box {
            margin-bottom: 30px;
        }

        .alert {
            padding: 16px 20px;
            border-radius: 10px;
            border-left: 4px solid;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: #86efac;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
            color: #fca5a5;
        }

        .alert-info {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--accent);
            color: #a5b4fc;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
            transform: translateY(-4px);
        }

        .kpi-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .kpi-icon {
            font-size: 2.2em;
            opacity: 0.8;
        }

        .kpi-label {
            font-size: 0.8em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .kpi-value {
            font-size: 2.2em;
            font-weight: 700;
            color: var(--accent-light);
            margin: 12px 0 8px 0;
        }

        .kpi-subtitle {
            font-size: 0.85em;
            color: var(--text-tertiary);
        }

        .chart-card {
            grid-column: span 1;
        }

        @media (max-width: 1400px) {
            .chart-card:nth-child(n+5) {
                grid-column: span 2;
            }
        }

        @media (max-width: 768px) {
            .chart-card {
                grid-column: span 1;
            }
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-container {
            position: relative;
            height: 320px;
        }

        .table-card {
            grid-column: span 2;
        }

        @media (max-width: 1000px) {
            .table-card {
                grid-column: span 1;
            }
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        thead {
            background: rgba(99, 102, 241, 0.1);
            border-bottom: 2px solid var(--border-color);
        }

        th {
            padding: 14px;
            text-align: left;
            font-weight: 600;
            color: var(--accent-light);
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        tbody tr:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85em;
        }

        .value-positive {
            color: var(--success);
            font-weight: 600;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>📊 Sales Operations Dashboard</h1>
                <p>Real-time insights into team performance, enterprise deals, and revenue metrics</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="downloadData()">📥 Export</button>
                <button class="btn btn-primary" onclick="reloadData()">🔄 Refresh</button>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Team Name</label>
                <select id="teamFilter">
                    <option value="">All Teams</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Enterprise</label>
                <select id="enterpriseFilter">
                    <option value="">All Enterprises</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Month</label>
                <select id="monthFilter">
                    <option value="">All Months</option>
                </select>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()">Apply</button>
                <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
            </div>
        </div>

        <div id="messageBox" class="message-box"></div>

        <div id="dashboardContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading dashboard data...</p>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];
        const CARD_UUID = '1d6e0c0d-ad06-4cfe-8308-ddff05187eca';
        const METABASE_BASE = 'https://metabase.spyne.ai';
        const CSV_URL = `${METABASE_BASE}/public/question/${CARD_UUID}.csv`;

        // Show message
        function showMessage(message, type = 'success') {
            const box = document.getElementById('messageBox');
            box.innerHTML = `<div class="alert alert-${type}">
                <span>${message}</span>
            </div>`;
            setTimeout(() => box.innerHTML = '', 5000);
        }

        // Parse CSV data
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            if (lines.length === 0) return [];
            
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const rows = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                
                // Handle quoted fields
                const cells = [];
                let current = '';
                let insideQuote = false;
                
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    const nextChar = line[j + 1];
                    
                    if (char === '"') {
                        if (insideQuote && nextChar === '"') {
                            current += '"';
                            j++;
                        } else {
                            insideQuote = !insideQuote;
                        }
                    } else if (char === ',' && !insideQuote) {
                        cells.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                cells.push(current.trim());
                
                rows.push(cells);
            }
            
            return rows;
        }

        // Fetch data from Metabase CSV
        async function fetchData() {
            try {
                console.log('🚀 Fetching data from Metabase CSV...');
                console.log('CSV URL:', CSV_URL);
                
                const response = await fetch(CSV_URL);

                console.log('Response Status:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const csvText = await response.text();
                console.log('CSV Data length:', csvText.length);
                console.log('First 500 chars:', csvText.substring(0, 500));

                allData = parseCSV(csvText);

                if (allData.length === 0) {
                    throw new Error('No data rows found in CSV');
                }

                console.log(`✅ Loaded ${allData.length} records from CSV`);
                console.log('Sample row:', allData[0]);
                
                filteredData = [...allData];
                populateFilters();
                renderDashboard();
                showMessage(`✅ Dashboard loaded successfully! (${allData.length} records)`, 'success');

            } catch (error) {
                console.error('❌ Error fetching CSV:', error);
                showApiError(error.message);
            }
        }

        // Show API Error
        function showApiError(errorMsg = '') {
            document.getElementById('dashboardContent').innerHTML = `
                <div class="card" style="grid-column: 1/-1; padding: 40px; text-align: center;">
                    <h2 style="color: #ef4444; margin-bottom: 16px;">⚠️ Connection Error</h2>
                    <p style="color: var(--text-secondary); margin-bottom: 20px;">
                        Unable to fetch data from Metabase CSV. Please verify:
                    </p>
                    <ul style="color: var(--text-secondary); text-align: left; display: inline-block; margin-bottom: 20px; font-size: 0.9em;">
                        <li>✓ Metabase instance is online: <a href="${METABASE_BASE}" target="_blank" style="color: #818cf8;">${METABASE_BASE}</a></li>
                        <li>✓ Public CSV URL: <a href="${CSV_URL}" target="_blank" style="color: #818cf8;">View CSV</a></li>
                        <li>✓ Network connectivity</li>
                        <li>✓ CSV export is enabled in Metabase</li>
                    </ul>
                    ${errorMsg ? `<p style="color: #fca5a5; margin: 15px 0; font-size: 0.85em; font-family: monospace;">Error: ${errorMsg}</p>` : ''}
                    <button class="btn btn-primary" onclick="fetchData()" style="margin-top: 20px;">🔄 Try Again</button>
                </div>
            `;
            showMessage('Connection failed. Check browser console for details.', 'error');
        }

        // Populate filter dropdowns
        function populateFilters() {
            const teams = [...new Set(allData.map(r => r[1]).filter(Boolean))].sort();
            const enterprises = [...new Set(allData.map(r => r[3]).filter(Boolean))].sort();
            const months = [...new Set(allData.map(r => r[10]).filter(Boolean))].sort();

            const teamSel = document.getElementById('teamFilter');
            const entSel = document.getElementById('enterpriseFilter');
            const monthSel = document.getElementById('monthFilter');

            teams.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                teamSel.appendChild(opt);
            });

            enterprises.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e;
                opt.textContent = e;
                entSel.appendChild(opt);
            });

            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                monthSel.appendChild(opt);
            });
        }

        // Apply filters
        function applyFilters() {
            const team = document.getElementById('teamFilter').value;
            const ent = document.getElementById('enterpriseFilter').value;
            const month = document.getElementById('monthFilter').value;

            filteredData = allData.filter(row => {
                return (!team || row[1] === team) &&
                       (!ent || row[3] === ent) &&
                       (!month || row[10] === month);
            });

            renderDashboard();
        }

        function resetFilters() {
            document.getElementById('teamFilter').value = '';
            document.getElementById('enterpriseFilter').value = '';
            document.getElementById('monthFilter').value = '';
            filteredData = [...allData];
            renderDashboard();
        }

        // Calculate KPIs
        function getKPIs() {
            const teams = new Set(filteredData.map(r => r[1]).filter(Boolean));
            const ents = new Set(filteredData.map(r => r[3]).filter(Boolean));
            const arr = filteredData.reduce((s, r) => s + (parseFloat(r[8]) || 0), 0);
            const skus = filteredData.reduce((s, r) => s + (parseFloat(r[11]) || 0), 0);
            const images = filteredData.reduce((s, r) => s + (parseFloat(r[12]) || 0), 0);

            return { teams: teams.size, ents: ents.size, arr, skus, images };
        }

        // Get top enterprises
        function getTopEnterprises(limit = 10) {
            const data = {};
            filteredData.forEach(row => {
                const name = row[3];
                const arr = parseFloat(row[8]) || 0;
                if (name) data[name] = (data[name] || 0) + arr;
            });
            return Object.entries(data)
                .map(([name, arr]) => ({ name, arr }))
                .sort((a, b) => b.arr - a.arr)
                .slice(0, limit);
        }

        // Get month-wise data
        function getMonthWiseData() {
            const data = {};
            filteredData.forEach(row => {
                const m = row[10];
                if (m) {
                    if (!data[m]) data[m] = { month: m, skus: 0, images: 0 };
                    data[m].skus += parseFloat(row[11]) || 0;
                    data[m].images += parseFloat(row[12]) || 0;
                }
            });
            return Object.values(data).sort((a, b) => new Date(a.month) - new Date(b.month));
        }

        // Render dashboard
        function renderDashboard() {
            const kpis = getKPIs();
            const topEnts = getTopEnterprises();
            const monthData = getMonthWiseData();

            let html = `
                <div class="dashboard">
                    <div class="card kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">Distinct Teams</span>
                            <span class="kpi-icon">👥</span>
                        </div>
                        <div class="kpi-value">${kpis.teams}</div>
                    </div>

                    <div class="card kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">Distinct Enterprises</span>
                            <span class="kpi-icon">🏢</span>
                        </div>
                        <div class="kpi-value">${kpis.ents}</div>
                    </div>

                    <div class="card kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">Total Contracted ARR</span>
                            <span class="kpi-icon">💰</span>
                        </div>
                        <div class="kpi-value">$${(kpis.arr / 1000000).toFixed(2)}M</div>
                        <div class="kpi-subtitle">${kpis.arr.toLocaleString('en-US', {style: 'currency', currency: 'USD'})}</div>
                    </div>

                    <div class="card kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">Total SKU Count</span>
                            <span class="kpi-icon">📦</span>
                        </div>
                        <div class="kpi-value">${kpis.skus.toLocaleString()}</div>
                        <div class="kpi-subtitle">${kpis.images.toLocaleString()} images</div>
                    </div>

                    <div class="card table-card">
                        <div class="card-title">🏆 Top 10 Enterprises by ARR</div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Rank</th>
                                        <th>Enterprise Name</th>
                                        <th>Contracted ARR</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${topEnts.map((e, i) => `
                                        <tr>
                                            <td><div class="rank-badge">${i + 1}</div></td>
                                            <td>${e.name}</td>
                                            <td class="value-positive">$${e.arr.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card chart-card">
                        <div class="card-title">📈 Monthly SKU Count</div>
                        <div class="chart-container">
                            <canvas id="skuChart"></canvas>
                        </div>
                    </div>

                    <div class="card chart-card">
                        <div class="card-title">🖼️ Monthly Image Count</div>
                        <div class="chart-container">
                            <canvas id="imageChart"></canvas>
                        </div>
                    </div>

                    <div class="card table-card">
                        <div class="card-title">📅 Monthly Performance Summary</div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Month</th>
                                        <th>SKU Count</th>
                                        <th>Image Count</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${monthData.map(m => `
                                        <tr>
                                            <td style="font-weight: 600;">${m.month}</td>
                                            <td class="value-positive">${m.skus.toLocaleString()}</td>
                                            <td class="value-positive">${m.images.toLocaleString()}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('dashboardContent').innerHTML = html;

            // Render charts
            if (monthData.length > 0) {
                renderSkuChart(monthData);
                renderImageChart(monthData);
            }
        }

        // Render SKU Chart
        function renderSkuChart(monthData) {
            const ctx = document.getElementById('skuChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthData.map(m => m.month),
                    datasets: [{
                        label: 'SKU Count',
                        data: monthData.map(m => m.skus),
                        borderColor: '#818cf8',
                        backgroundColor: 'rgba(129, 140, 248, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 5,
                        pointBackgroundColor: '#818cf8',
                        pointBorderColor: '#1a1f2e',
                        pointBorderWidth: 2,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#e4e6eb', font: { size: 12 } }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#8a8d91' },
                            grid: { color: 'rgba(99, 102, 241, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#8a8d91' },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // Render Image Chart
        function renderImageChart(monthData) {
            const ctx = document.getElementById('imageChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthData.map(m => m.month),
                    datasets: [{
                        label: 'Image Count',
                        data: monthData.map(m => m.images),
                        borderColor: '#a78bfa',
                        backgroundColor: 'rgba(167, 139, 250, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 5,
                        pointBackgroundColor: '#a78bfa',
                        pointBorderColor: '#1a1f2e',
                        pointBorderWidth: 2,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#e4e6eb', font: { size: 12 } }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#8a8d91' },
                            grid: { color: 'rgba(99, 102, 241, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#8a8d91' },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // Download data
        function downloadData() {
            if (filteredData.length === 0) {
                showMessage('No data to download', 'error');
                return;
            }

            const csv = [
                ['Team Name', 'Enterprise', 'Stage', 'Contracted ARR', 'Month', 'SKU Count', 'Image Count'],
                ...filteredData.map(r => [
                    r[1], r[3], r[5], r[8], r[10], r[11], r[12]
                ])
            ].map(row => row.map(v => `"${v}"`).join(',')).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dashboard_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            showMessage('✅ Data exported successfully!', 'success');
        }

        function reloadData() {
            document.getElementById('dashboardContent').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Reloading dashboard...</p>
                </div>
            `;
            fetchData();
        }

        // Initialize
        window.addEventListener('load', fetchData);
    </script>
</body>
</html>
